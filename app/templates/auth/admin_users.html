{% extends "base.html" %}

{% block content %}
  <h1>Admin - Manage Users</h1>
  <a href="{{ url_for('auth.admin_users_add') }}" class="btn btn-primary">Add User</a>
  <table class="table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Username</th>
        <th>Email</th>
        <th>Role</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for user in users %}
        <tr>
          <td>{{ user.id }}</td>
          <td>{{ user.username }}</td>
          <td>{{ user.email }}</td>
          <td>{{ user.role }}</td>
          <td>
            <a href="{{ url_for('auth.admin_users_remove', user_id=user.id) }}" class="btn btn-danger">Remove</a>
          </td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
